<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f2f2ef" />
  <meta name="description" content="UNKNOWN-MESSAGE · 未读信号" />

  <title>未读信号 · UNKNOWN-MESSAGE</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/loading.css" />
  <link rel="stylesheet" href="./css/home.css" />
</head>

<body>
  <div class="app-shell">
    <!-- 加载页 -->
    <section
      class="loading-screen"
      id="loadingScreen"
      aria-label="应用加载中"
    >
      <div class="loading-grain" aria-hidden="true"></div>
      <div class="loading-ambient loading-ambient-a" aria-hidden="true"></div>
      <div class="loading-ambient loading-ambient-b" aria-hidden="true"></div>

      <div class="loading-frame" aria-hidden="true">
        <span class="frame-corner frame-corner-tl"></span>
        <span class="frame-corner frame-corner-tr"></span>
        <span class="frame-corner frame-corner-bl"></span>
        <span class="frame-corner frame-corner-br"></span>
      </div>

      <header class="loading-header">
        <span class="status-mark"></span>
        <span>CHANNEL / OPEN</span>

        <span class="loading-header-spacer"></span>

        <span>LINE 01</span>
        <span class="signal-bars" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </span>
      </header>

      <main class="loading-core">
        <div class="signal-orbit signal-orbit-large" aria-hidden="true"></div>
        <div class="signal-orbit signal-orbit-medium" aria-hidden="true"></div>
        <div class="signal-orbit signal-orbit-small" aria-hidden="true"></div>

        <div class="signal-beam signal-beam-1" aria-hidden="true"></div>
        <div class="signal-beam signal-beam-2" aria-hidden="true"></div>
        <div class="signal-beam signal-beam-3" aria-hidden="true"></div>
        <div class="signal-beam signal-beam-4" aria-hidden="true"></div>
        <div class="signal-beam signal-beam-5" aria-hidden="true"></div>

        <div class="connection-node">
          <img
            class="phone-icon"
            src="./assets/phone.svg"
            alt=""
            aria-hidden="true"
          />
        </div>

        <div class="loading-copy">
          <h1>正在建立连接</h1>
          <p>INITIALIZING MESSAGE CHANNEL</p>
        </div>

        <div class="loading-progress" aria-hidden="true">
          <span></span>
        </div>
      </main>

      <aside class="loading-side-label">
        SIGNAL / SEARCHING
      </aside>

      <footer class="loading-footer">
        <span>LOCAL INTERFACE · READY</span>
        <span id="loadingClock">00:00:00</span>
      </footer>
    </section>

    <!-- 主入口 -->
    <section class="home-screen is-hidden" id="homeScreen">
      <div class="home-background-glow" aria-hidden="true"></div>
      <div class="home-grain" aria-hidden="true"></div>

      <header class="home-header">
        <div class="brand-lockup">
          <span class="brand-kicker">UNKNOWN-MESSAGE</span>
          <h1>未读信号</h1>
        </div>

        <span class="brand-index">NO. 001</span>
      </header>

      <main class="home-main">
        <div class="home-intro">
          <p class="home-overline">A PRIVATE MESSAGE INTERFACE</p>
          <p class="home-description">
            选择一个入口，开始一次随机回应。
          </p>
        </div>

        <nav class="home-navigation" aria-label="主导航">
          <a
            class="home-entry home-entry-primary"
            href="./pages/question.html"
          >
            <span class="entry-number">01</span>

            <span class="entry-content">
              <strong>提问箱</strong>
              <small>ASK A QUESTION</small>
            </span>

            <span class="entry-arrow" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5 12H19"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M13 6L19 12L13 18"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </a>

          <a
            class="home-entry"
            href="./pages/settings.html"
          >
            <span class="entry-number">02</span>

            <span class="entry-content">
              <strong>设置</strong>
              <small>CONFIGURATION</small>
            </span>

            <span class="entry-arrow" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5 12H19"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M13 6L19 12L13 18"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </a>
        </nav>
      </main>

      <footer class="home-footer">
        <span>ALL SIGNALS ARE RANDOM</span>
        <span>LOCAL / OFFLINE</span>
      </footer>
    </section>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
