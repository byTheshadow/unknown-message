
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f2f2ef" />
  <meta name="description" content="未读信号提问箱" />

  <title>提问箱 · 未读信号</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/question.css" />
  <link rel="stylesheet" href="../css/question-layout.css" />
</head>

<body>
  <main class="question-page is-drawer-open" id="questionPage">
    <div class="question-grain" aria-hidden="true"></div>
    <div class="question-ambient ambient-one" aria-hidden="true"></div>
    <div class="question-ambient ambient-two" aria-hidden="true"></div>

    <header class="question-header">
      <a class="back-button" href="../index.html" aria-label="返回主页">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M19 12H5"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
          <path
            d="M11 6L5 12L11 18"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>

      <div class="question-brand">
        <span>UNKNOWN-MESSAGE</span>
        <strong>提问箱</strong>
      </div>

      <button
        class="header-icon-button"
        id="exportButton"
        type="button"
        aria-label="生成对话长图"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"
            stroke="currentColor"
            stroke-width="1.4"
          />
          <path
            d="M8 15L10.7 12.3L12.8 14.4L15.1 11.8L18 15"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="9" cy="9" r="1.2" fill="currentColor" />
        </svg>
      </button>
    </header>

    <section class="session-meta" aria-label="当前传输设置">
      <div class="session-meta-line">
        <span class="meta-dot"></span>
        <span>MESSAGE INTERFACE / ACTIVE</span>
      </div>

      <button class="wait-setting-link" id="waitSettingLink" type="button">
        <span>回复上限</span>
        <strong id="waitTimeLabel">05:00</strong>
      </button>
    </section>

    <section class="conversation-area" id="conversationArea" aria-live="polite">
      <div class="empty-conversation" id="emptyConversation">
        <div class="empty-orbit empty-orbit-one" aria-hidden="true"></div>
        <div class="empty-orbit empty-orbit-two" aria-hidden="true"></div>

        <p class="empty-eyebrow">A QUIET PLACE FOR ONE QUESTION</p>
        <h1>让一个问题停在这里</h1>
        <p class="empty-description">
          写下它，随后留出一段不被催促的空白。
        </p>
      </div>

      <div class="message-list" id="messageList"></div>
    </section>

    <section class="composer-panel" id="composerPanel" aria-label="提问终端">
      <div class="composer-drawer-top">
        <div class="composer-drawer-layer composer-drawer-layer-one" aria-hidden="true"></div>
        <div class="composer-drawer-layer composer-drawer-layer-two" aria-hidden="true"></div>

        <button
          class="drawer-toggle"
          id="drawerToggle"
          type="button"
          aria-expanded="true"
          aria-controls="questionForm"
        >
          <span class="drawer-handle" aria-hidden="true"></span>
          <span class="drawer-toggle-copy">
            <span>QUESTION TERMINAL</span>
            <strong>提问抽屉</strong>
          </span>
          <span class="drawer-toggle-state">收束</span>
        </button>
      </div>

      <div class="composer-drawer-content">
        <div class="composer-intro">
          <span class="composer-index">01 / QUESTION TERMINAL</span>
          <strong>写下想被听见的事</strong>
          <p>这不是即时对话。每一次开启，都会留下一段独立的等待。</p>
        </div>

        <form class="question-form" id="questionForm">
          <label class="field-group field-recipient">
            <span class="field-label">提问对象 / TO</span>
            <input
              id="recipientInput"
              name="recipient"
              type="text"
              maxlength="24"
              autocomplete="off"
              placeholder="姓名或一个称呼"
            />
          </label>

          <label class="field-group field-question">
            <span class="field-label">你的问题 / QUESTION</span>
            <textarea
              id="questionInput"
              name="question"
              rows="4"
              maxlength="160"
              placeholder="把此刻无法确认的事，写在这里"
            ></textarea>
          </label>

          <div class="form-bottom">
            <span class="character-count" id="characterCount">0 / 160</span>

            <button class="send-button" id="sendButton" type="submit">
              <span>OPEN CHANNEL</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M5 12H19"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M13 6L19 12L13 18"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </form>

        <div class="record-notice">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 7V12"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <circle cx="12" cy="16" r="0.8" fill="currentColor" />
            <path
              d="M10.3 4.2L3.9 15.2C3.1 16.6 4.1 18.3 5.7 18.3H18.3C19.9 18.3 20.9 16.6 20.1 15.2L13.7 4.2C12.9 2.9 11.1 2.9 10.3 4.2Z"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>

          <span>记录仅暂存于当前设备。</span>

          <button id="clearHistoryButton" type="button">
            清除记录
          </button>
        </div>
      </div>
    </section>

    <div class="export-layer is-hidden" id="exportLayer" role="dialog" aria-modal="true">
      <div class="export-backdrop" data-close-export="true"></div>

      <section class="export-dialog" aria-label="对话长图">
        <header class="export-dialog-header">
          <div>
            <span>MESSAGE ARCHIVE</span>
            <strong>对话长图已生成</strong>
          </div>

          <button
            class="header-icon-button"
            id="closeExportButton"
            type="button"
            aria-label="关闭长图预览"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M6 6L18 18M18 6L6 18"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>

        <div class="export-image-wrap">
          <img id="exportImage" alt="未读信号对话记录长图" />
        </div>

        <p class="export-help">
          长按图片保存；桌面设备可使用下载按钮保存。
        </p>

        <a class="download-button" id="downloadButton" download="unknown-message-record.png">
          下载长图
        </a>
      </section>
    </div>
  </main>

  <script type="module" src="../js/question.js"></script>

  <script>
    (() => {
      const questionPage = document.getElementById("questionPage");
      const drawerToggle = document.getElementById("drawerToggle");

      if (!questionPage || !drawerToggle) {
        return;
      }

      const updateDrawer = () => {
        const isOpen = questionPage.classList.contains("is-drawer-open");

        drawerToggle.setAttribute("aria-expanded", String(isOpen));

        const state = drawerToggle.querySelector(".drawer-toggle-state");

        if (state) {
          state.textContent = isOpen ? "收束" : "展开";
        }
      };

      drawerToggle.addEventListener("click", () => {
        if (questionPage.classList.contains("is-waiting")) {
          return;
        }

        questionPage.classList.toggle("is-drawer-open");
        updateDrawer();
      });

      updateDrawer();
    })();
  </script>
</body>
</html>
