<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f2f2ef" />
  <meta name="description" content="未读信号提问箱" />

  <title>提问箱 · 未读信号</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/question.css" />
</head>

<body>
  <main class="question-page">
    <div class="question-grain" aria-hidden="true"></div>
    <div class="question-ambient ambient-one" aria-hidden="true"></div>
    <div class="question-ambient ambient-two" aria-hidden="true"></div>

    <header class="question-header">
      <a class="back-button" href="../index.html" aria-label="返回主页">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M19 12H5"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
          <path
            d="M11 6L5 12L11 18"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>

      <div class="question-brand">
        <span>UNKNOWN-MESSAGE</span>
        <strong>提问箱</strong>
      </div>

      <button
        class="header-icon-button"
        id="exportButton"
        type="button"
        aria-label="生成对话长图"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="4"
            width="16"
            height="16"
            rx="2"
            stroke="currentColor"
            stroke-width="1.4"
          />
          <path
            d="M8 15L10.7 12.3L12.8 14.4L15.1 11.8L18 15"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            cx="9"
            cy="9"
            r="1.2"
            fill="currentColor"
          />
        </svg>
      </button>
    </header>

    <section class="session-meta" aria-label="当前传输设置">
      <div class="session-meta-line">
        <span class="meta-dot"></span>
        <span>MESSAGE INTERFACE / ACTIVE</span>
      </div>

      <button class="wait-setting-link" id="waitSettingLink" type="button">
        <span>回复上限</span>
        <strong id="waitTimeLabel">05:00</strong>
      </button>
    </section>

    <section class="conversation-area" id="conversationArea" aria-live="polite">
      <div class="empty-conversation" id="emptyConversation">
        <div class="empty-orbit empty-orbit-one" aria-hidden="true"></div>
        <div class="empty-orbit empty-orbit-two" aria-hidden="true"></div>

        <div class="empty-node" aria-hidden="true">
          <svg
            viewBox="0 0 48 48"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="24"
              cy="24"
              r="13"
              stroke="currentColor"
              stroke-width="1.25"
            />
            <path
              d="M24 16V24L29 28"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M11 24H7M41 24H37M24 11V7M24 41V37"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <p class="empty-eyebrow">NO MESSAGE RECORD</p>
        <h1>写下第一条问题</h1>
        <p class="empty-description">
          每一条提问都会进入独立的等待流程。
        </p>
      </div>

      <div class="message-list" id="messageList"></div>
    </section>

    <section class="composer-panel" id="composerPanel">
      <div class="record-notice">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M12 7V12"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16" r="0.8" fill="currentColor" />
          <path
            d="M10.3 4.2L3.9 15.2C3.1 16.6 4.1 18.3 5.7 18.3H18.3C19.9 18.3 20.9 16.6 20.1 15.2L13.7 4.2C12.9 2.9 11.1 2.9 10.3 4.2Z"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>

        <span>记录暂存于当前设备，请及时生成长图保存。</span>

        <button id="clearHistoryButton" type="button">
          清除记录
        </button>
      </div>

      <form class="question-form" id="questionForm">
        <label class="field-group field-recipient">
          <span class="field-label">提问对象</span>
          <input
            id="recipientInput"
            name="recipient"
            type="text"
            maxlength="24"
            autocomplete="off"
            placeholder="填写姓名或称呼"
          />
        </label>

        <label class="field-group field-question">
          <span class="field-label">问题</span>
          <textarea
            id="questionInput"
            name="question"
            rows="2"
            maxlength="160"
            placeholder="写下你想问的问题"
          ></textarea>
        </label>

        <div class="form-bottom">
          <span class="character-count" id="characterCount">0 / 160</span>

          <button class="send-button" id="sendButton" type="submit">
            <span>发送问题</span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M5 12H19"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
              <path
                d="M13 6L19 12L13 18"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </form>
    </section>

    <div class="export-layer is-hidden" id="exportLayer" role="dialog" aria-modal="true">
      <div class="export-backdrop" data-close-export="true"></div>

      <section class="export-dialog" aria-label="对话长图">
        <header class="export-dialog-header">
          <div>
            <span>MESSAGE ARCHIVE</span>
            <strong>对话长图已生成</strong>
          </div>

          <button
            class="header-icon-button"
            id="closeExportButton"
            type="button"
            aria-label="关闭长图预览"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M6 6L18 18M18 6L6 18"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>

        <div class="export-image-wrap">
          <img id="exportImage" alt="未读信号对话记录长图" />
        </div>

        <p class="export-help">
          长按图片保存；桌面设备可使用下载按钮保存。
        </p>

        <a class="download-button" id="downloadButton" download="unknown-message-record.png">
          下载长图
        </a>
      </section>
    </div>
  </main>

  <script type="module" src="../js/question.js"></script>
</body>
</html>
