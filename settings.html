<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f4f1" />
    <title>设置 · 未读信号</title>

    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/settings.css" />
  </head>

  <body>
    <main class="page-shell">
      <header class="page-header">
        <a class="back-button" href="./index.html" aria-label="返回首页">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M19 12H5M10 7L5 12L10 17"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>返回</span>
        </a>

        <div class="page-number">SETTINGS / 02</div>
      </header>

      <section class="settings-page-content">
        <div class="page-heading">
          <p class="page-eyebrow">SETTINGS</p>
          <h1>调整连接参数。</h1>
          <p class="page-description">
            所有设置只保存在当前设备中，不会发往网络。
          </p>
        </div>

        <section class="settings-section" aria-labelledby="duration-title">
          <div class="section-heading">
            <div>
              <p class="section-index">01 / WAITING WINDOW</p>
              <h2 id="duration-title">最长等待时间</h2>
            </div>

            <output id="duration-value" class="duration-value">05:00</output>
          </div>

          <input
            id="duration-range"
            class="duration-range"
            type="range"
            min="30"
            max="900"
            step="30"
            value="300"
            aria-label="最长等待时间"
          />

          <div class="range-labels" aria-hidden="true">
            <span>00:30</span>
            <span>15:00</span>
          </div>

          <p class="setting-note">
            在此时间范围内，回应可随时到达；只有超过设定上限时，系统才会调用随机回音库。
          </p>
        </section>

        <section class="settings-section" aria-labelledby="categories-title">
          <div class="section-heading">
            <div>
              <p class="section-index">02 / CARD CATEGORIES</p>
              <h2 id="categories-title">启用字卡分类</h2>
            </div>

            <span id="enabled-count" class="category-count">0 已启用</span>
          </div>

          <p class="setting-note">
            分类用于整理和拼接字卡内容，不包含任何按性格或语义倾向进行的筛选。
          </p>

          <div id="category-list" class="category-list"></div>

          <button id="add-category-button" class="secondary-button" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 5V19M5 12H19"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>新增分类</span>
          </button>
        </section>
      </section>

      <footer class="page-footer">
        <span>SETTINGS / SAVED LOCALLY</span>
        <span>UM / 01</span>
      </footer>
    </main>

    <dialog id="category-dialog" class="category-dialog">
      <form id="category-form" method="dialog">
        <div class="dialog-heading">
          <p>NEW CATEGORY</p>
          <h2>新增字卡分类</h2>
        </div>

        <label for="new-category-name">分类名称</label>
        <input
          id="new-category-name"
          type="text"
          maxlength="16"
          autocomplete="off"
          placeholder="例如：地点"
        />

        <div class="dialog-actions">
          <button id="cancel-category-button" class="dialog-text-button" type="button">
            取消
          </button>
          <button class="dialog-confirm-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="./js/app.js"></script>
    <script src="./js/settings.js"></script>
  </body>
</html>
